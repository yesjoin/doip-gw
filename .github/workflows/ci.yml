# =============================================================================
# ci.yml —— doip-gw 的持续集成（M0 就接，不等到最后补）
#
# 从项目二抄来的三条铁律：
#   1. 干净环境：每次全新 checkout，没有残留 build/
#   2. 参数一致：和 tools/ci_local.sh 一模一样，本地绿 ≈ CI 绿
#   3. gcc 腿带 -Werror，"零警告"由机器保证；clang 腿只查可移植性
# =============================================================================
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: 构建 + 自测（${{ matrix.compiler }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            werror: ON
          - compiler: clang
            werror: OFF

    steps:
      - uses: actions/checkout@v4

      - name: 选编译器
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"    >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc"      >> "$GITHUB_ENV"
            echo "CXX=g++"     >> "$GITHUB_ENV"
          fi

      - name: 记录环境（红了先看这段）
        run: |
          $CXX --version | head -1
          cmake --version | head -1
          uname -srm

      - name: 配置
        # -O2 与 ci_local.sh 一致：有些警告只在优化后才出现（如 glibc 的 warn_unused_result）
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-O2 -DDOIP_WERROR=${{ matrix.werror }}

      - name: 构建
        # 失败时把编译器吐的 error / warning 行抬成 annotation。
        #   目的不是"修"，是"看得见"：日志页要登录，check-runs 接口只有 exit code；
        #   抬成 annotation 之后，一条 curl 就能读到是哪个文件哪一行红的。
        run: |
          if ! cmake --build build -j"$(nproc)" > /tmp/build.log 2>&1; then
            grep -E "error:|warning:|undefined reference" /tmp/build.log | head -20 \
              | while IFS= read -r l; do echo "::error::${l}"; done
            tail -n 40 /tmp/build.log
            exit 1
          fi
          tail -n 3 /tmp/build.log

      - name: 自测（ctest）
        run: cd build && ctest --output-on-failure

      - name: 工具冒烟：把一段十六进制翻译成人话
        run: |
          OUT=$(./build/doip-dump "02 FD 80 01 00 00 00 07 0E 00 00 01 22 F1 90")
          echo "$OUT"
          echo "$OUT" | grep -q "0x8001" || { echo "::error::doip-dump 没认出 0x8001"; exit 1; }
          echo "$OUT" | grep -q "ReadDataByIdentifier" || { echo "::error::doip-dump 没认出 0x22 服务"; exit 1; }

      - name: 端到端：实体 + 客户端走真 UDP（loopback）
        run: |
          ./build/doip-discover --serve --port 13455 --seconds 3 > /tmp/serve.log 2>&1 &
          SRV=$!
          sleep 0.5
          if ! ./build/doip-discover --host 127.0.0.1 --port 13455 --wait-ms 800; then
            echo "::error::客户端没收到应答"
            cat /tmp/serve.log
            exit 1
          fi
          wait $SRV || true
          cat /tmp/serve.log
          grep -q "回了 1 个应答" /tmp/serve.log || { echo "::error::实体侧没记录到应答"; exit 1; }

      - name: 端到端：实体 + 客户端走真 TCP（loopback）
        run: |
          ./build/doip-serve --port 13456 --seconds 4 --idle-ms 5000 > /tmp/tcpserve.log 2>&1 &
          SRV=$!
          sleep 0.5
          if ! ./build/doip-client --host 127.0.0.1 --port 13456 --sa 0E00 --alive --diag "22 F1 86" > /tmp/tcpclient.log 2>&1; then
            echo "::error::客户端 TCP 激活/心跳/诊断失败"
            cat /tmp/tcpclient.log
            cat /tmp/tcpserve.log
            exit 1
          fi
          cat /tmp/tcpclient.log
          wait $SRV || true
          cat /tmp/tcpserve.log
          grep -q "code=0x10" /tmp/tcpclient.log       || { echo "::error::应答码不是 0x10"; exit 1; }
          grep -q "0x0008 心跳应答" /tmp/tcpclient.log   || { echo "::error::心跳没应答"; exit 1; }
          grep -q "0x8002 ACK" /tmp/tcpclient.log       || { echo "::error::没有 0x8002 回执"; exit 1; }
          grep -q "UDS=62 F1 86 01" /tmp/tcpclient.log  || { echo "::error::诊断响应不对"; exit 1; }
          grep -q "成功激活 1 次" /tmp/tcpserve.log      || { echo "::error::实体侧没记录到激活"; exit 1; }

